    <script>
        const logBox = document.getElementById('console_log');

        function printLog(message, isError = false) {
            const time = new Date().toLocaleTimeString();
            const colorClass = isError ? 'text-red-400' : 'text-green-400';
            logBox.innerHTML += `<br><span class="text-slate-500">[${time}]</span> <span class="${colorClass}">${message}</span>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Emote Submission
        document.getElementById('emoteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const tc = document.getElementById('tc').value;
            const emote_id = document.getElementById('emote_id').value;
            
            let queryParams = `tc=${tc}&emote_id=${emote_id}`;
            
            for(let i=1; i<=6; i++) {
                const uidVal = document.getElementById(`uid${i}`).value.trim();
                if(uidVal) queryParams += `&uid${i}=${uidVal}`;
            }

            printLog(`Sending Emote request for Team: ${tc}...`);

            try {
                const response = await fetch(`/join?${queryParams}`);
                const data = await response.json();
                if(data.status === 'success') {
                    printLog(`🟢 Success: ${data.message} (Emote ID: ${data.emote_id})`);
                } else {
                    printLog(`🔴 Error: ${data.message}`, true);
                }
            } catch (err) {
                printLog(`🔴 Network Error: ${err.message}`, true);
            }
        });

        // Quick Bundle Selection
        async function quickBundle(name) {
            printLog(`Requesting Bundle change to: ${name}...`);
            try {
                const response = await fetch(`/bundle?name=${name}`);
                const data = await response.json();
                if(data.status === 'success') {
                    printLog(`🟢 Success: ${data.message}`);
                } else {
                    printLog(`🔴 Error: ${data.message}`, true);
                }
            } catch (err) {
                printLog(`🔴 Network Error: ${err.message}`, true);
            }
        }

        // Custom Bundle Input Selection
        async function changeBundleCustom() {
            const inputVal = document.getElementById('bundle_input').value.trim();
            if(!inputVal) {
                printLog(`🔴 Error: Input field is empty!`, true);
                return;
            }
            printLog(`Requesting Custom Bundle change for: ${inputVal}...`);
            try {

                } else {

                }
